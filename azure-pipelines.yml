trigger:
- build

variables:
  REGISTRY: docker-registry.saas.cd
  IMAGE_NAME: chai-conge-request
  TAG: 1.0.1

pool:
  name: eShopOnWebSelfPool

steps:
- checkout: self

# 🔹 Node.js
# - task: NodeTool@0
#   inputs:
#     versionSpec: '22.x'
#   displayName: 'Use Node.js 22'

# 🔹 Build Next.js
# - script: |
#     yarn install --frozen-lockfile
#     yarn build
#   displayName: 'Build Next.js'

# 🔹 Login Docker Registry
# - script: |
#     echo "$(DOCKER_PASSWORD)" | docker login $(REGISTRY) \
#       -u "$(DOCKER_USERNAME)" --password-stdin
#   displayName: 'Docker Login'

# 🔹 Build Docker Image
- script: |
    docker build \
      -t $(REGISTRY)/chai/$(IMAGE_NAME):$(TAG) \
      -t $(REGISTRY)/chai/$(IMAGE_NAME):latest \
      .
  displayName: 'Docker Build'

# 🔹 Push Docker Image
- script: |
    docker push $(REGISTRY)/chai/$(IMAGE_NAME):$(TAG)
    docker push $(REGISTRY)/chai/$(IMAGE_NAME):latest
  displayName: 'Docker Push'
